name: Aftercoda
packages:
  Alamofire:
    url: https://github.com/wrandecima-bit/Alamofire
    revision: 7fdd403089757be2ce6991b287c7bef612c8bd04
options:
  bundleIdPrefix: pro.aftercoda
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Aftercoda:
    type: application
    platform: iOS
    sources:
      - path: Aftercoda
    resources:
      - path: PrivacyInfo.xcprivacy
    dependencies:
      - package: Alamofire
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pro.aftercoda.ring
        PRODUCT_NAME: Aftercoda
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_CFBundleDisplayName: Aftercoda
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_ImageName: afc_Splash
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_NSCameraUsageDescription: This app does not use the camera.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
  AftercodaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AftercodaTests
    dependencies:
      - target: Aftercoda
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pro.aftercoda.ring.tests
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "6.2"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Aftercoda.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Aftercoda"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
  AftercodaShotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AftercodaShotTests
    dependencies:
      - target: Aftercoda
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pro.aftercoda.ring.tests.shots
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "6.2"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Aftercoda.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Aftercoda"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
schemes:
  Aftercoda:
    build:
      targets:
        Aftercoda: all
        AftercodaTests: [test]
    test:
      targets:
        - AftercodaTests
  AftercodaShots:
    build:
      targets:
        Aftercoda: all
        AftercodaShotTests: [test]
    test:
      targets:
        - AftercodaShotTests
